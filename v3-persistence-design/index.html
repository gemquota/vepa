<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEPA v3 // Design Artifacts</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a28;
  --border: #2a2a3e; --text: #c8c8d4; --text-dim: #6a6a7e;
  --accent: #6a5acd; --accent2: #e0b0ff; --green: #50c878;
  --orange: #e8a040; --red: #e05050;
  --font: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
body { font-family: var(--font-ui); background: var(--bg); color: var(--text); line-height: 1.6; }

/* ─── Layout ─── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ─── Sidebar ─── */
.sidebar {
  width: 300px; min-width: 300px; background: var(--surface);
  border-right: 1px solid var(--border); overflow-y: auto;
  display: flex; flex-direction: column;
  transition: transform 0.2s ease, opacity 0.15s ease;
  z-index: 10;
}
.sidebar.hidden {
  transform: translateX(-100%);
  opacity: 0;
  pointer-events: none;
  position: fixed;
  top: 0; left: 0; bottom: 0;
}
.sidebar-header {
  padding: 20px; border-bottom: 1px solid var(--border);
  background: var(--surface2); display: flex; justify-content: space-between; align-items: center;
}
.sidebar-header h1 { font-family: var(--font); font-size: 13px; color: var(--accent2); letter-spacing: 2px; text-transform: uppercase; }
.sidebar-header p { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
.sidebar-close {
  background: none; border: 1px solid var(--border); color: var(--text-dim);
  width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
  font-size: 16px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.sidebar-close:hover { background: var(--surface); color: var(--text); border-color: var(--accent); }
.artifact-list { flex: 1; overflow-y: auto; padding: 8px; }
.artifact-item {
  padding: 10px 12px; cursor: pointer; border-radius: 6px;
  margin-bottom: 2px; transition: background 0.15s;
  border-left: 3px solid transparent;
}
.artifact-item:hover { background: var(--surface2); }
.artifact-item.active { background: var(--surface2); border-left-color: var(--accent); }
.artifact-item .num { font-family: var(--font); font-size: 10px; color: var(--text-dim); }
.artifact-item .title { font-size: 13px; font-weight: 500; margin-top: 1px; }
.artifact-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; display: flex; gap: 8px; align-items: center; }
.badge { font-size: 9px; padding: 1px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.badge-blue { background: rgba(106,90,205,0.2); color: var(--accent); }
.badge-green { background: rgba(80,200,120,0.2); color: var(--green); }
.badge-orange { background: rgba(232,160,64,0.2); color: var(--orange); }
.badge-red { background: rgba(224,80,80,0.2); color: var(--red); }

/* ─── Toggle Button ─── */
.sidebar-toggle {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 20;
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  cursor: pointer;
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  font-family: var(--font);
}
.sidebar-toggle:hover { background: var(--surface2); color: var(--accent2); border-color: var(--accent); }

/* ─── Main Content ─── */
.main { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 960px; margin-left: 0; }
.main.shifted { margin-left: 0; }

/* ─── Markdown ─── */
.content { display: none; }
.content.active { display: block; }
.content h1 { font-family: var(--font); font-size: 22px; color: var(--accent2); margin: 0 0 16px; letter-spacing: -0.5px; }
.content h2 { font-size: 16px; color: var(--accent2); margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.content h3 { font-size: 14px; color: var(--text); margin: 20px 0 8px; }
.content p { margin: 8px 0; font-size: 14px; line-height: 1.7; }
.content ul, .content ol { margin: 8px 0; padding-left: 24px; }
.content li { margin: 4px 0; font-size: 14px; line-height: 1.6; }
.content strong { color: #e0e0f0; }
.content code { font-family: var(--font); font-size: 12px; background: var(--surface2); padding: 1px 5px; border-radius: 3px; }
.content pre { font-family: var(--font); font-size: 12px; background: var(--surface2); padding: 14px 16px; border-radius: 6px; overflow-x: auto; border: 1px solid var(--border); margin: 12px 0; line-height: 1.5; }
.content pre code { background: none; padding: 0; }
.content blockquote { border-left: 3px solid var(--accent); padding: 8px 16px; margin: 12px 0; background: var(--surface2); border-radius: 0 6px 6px 0; font-size: 13px; color: var(--text-dim); }
.content hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
.content th, .content td { padding: 8px 12px; text-align: left; border: 1px solid var(--border); }
.content th { background: var(--surface2); color: var(--accent2); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
.content tr:hover td { background: rgba(106,90,205,0.05); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.empty-state { display: flex; align-items: center; justify-content: center; height: 60vh; color: var(--text-dim); font-size: 14px; text-align: center; padding: 40px; }

/* ─── Overlay when sidebar is open on narrow view ─── */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 5;
}
.sidebar-overlay.show { display: block; }

@media (max-width: 768px) {
  .main { padding: 20px; }
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 10; }
}
</style>
</head>
<body>
<div class="app">
  <!-- Overlay for click-off-to-close -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Toggle button -->
  <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle artifact list">☰</button>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div>
        <h1>// VEPA v3 artifacts</h1>
        <p>Persistent world architecture &middot; 10 documents</p>
      </div>
      <button class="sidebar-close" id="sidebar-close" title="Close sidebar">✕</button>
    </div>
    <div class="artifact-list" id="artifact-list"></div>
  </nav>

  <!-- Main -->
  <main class="main" id="main-content">
    <div class="empty-state" id="empty-state">
      <div><div style="font-size: 40px; margin-bottom: 12px;">&#9671;</div>
      <strong>Select an artifact</strong> from the sidebar.</div>
    </div>
    <div id="content-container"></div>
  </main>
</div>

<script>
const artifacts = [
  { id: "01-formal-spec", title: "Formal Specification", meta: "v3.0.0-draft &middot; baseline", badge: "Spec", cls: "badge-blue" },
  { id: "02-review-architect", title: "Review: Architect", meta: "Adversarial &middot; structural", badge: "Review", cls: "badge-orange" },
  { id: "03-review-engineer", title: "Review: Engineer", meta: "Adversarial &middot; implementation", badge: "Review", cls: "badge-orange" },
  { id: "04-review-player", title: "Review: Player", meta: "Adversarial &middot; UX", badge: "Review", cls: "badge-orange" },
  { id: "05-spec-improvement-plan", title: "Spec Improvement Plan", meta: "P0/P1/P2 consolidated", badge: "Plan", cls: "badge-green" },
  { id: "06-updated-spec", title: "Updated Specification", meta: "Incorporates all reviews", badge: "Spec", cls: "badge-blue" },
  { id: "07-impl-review-architect", title: "Implementation Review: Architect", meta: "Adversarial &middot; v3/src/", badge: "Review", cls: "badge-red" },
  { id: "08-impl-review-engineer", title: "Implementation Review: Engineer", meta: "Adversarial &middot; v3/src/", badge: "Review", cls: "badge-red" },
  { id: "09-impl-review-player", title: "Implementation Review: Player", meta: "Adversarial &middot; v3/src/", badge: "Review", cls: "badge-red" },
  { id: "10-impl-improvement-plan", title: "Implementation Improvement Plan", meta: "All fixes applied", badge: "Plan", cls: "badge-green" },
];

// ─── Sidebar state ───
const sidebar = document.getElementById("sidebar");
const toggleBtn = document.getElementById("sidebar-toggle");
const closeBtn = document.getElementById("sidebar-close");
const overlay = document.getElementById("sidebar-overlay");

function showSidebar() { sidebar.classList.remove("hidden"); overlay.classList.add("show"); }
function hideSidebar() { sidebar.classList.add("hidden"); overlay.classList.remove("show"); }
function toggleSidebar() { sidebar.classList.contains("hidden") ? showSidebar() : hideSidebar(); }

toggleBtn.addEventListener("click", toggleSidebar);
closeBtn.addEventListener("click", hideSidebar);
overlay.addEventListener("click", hideSidebar);

// Hide on any main-content click (clicking off the sidebar)
document.getElementById("main-content").addEventListener("click", (e) => {
  // Don't close if clicking the toggle button
  if (!sidebar.classList.contains("hidden")) hideSidebar();
});

// ─── Markdown loading & rendering ───
const mdCache = {};
async function loadMd(id) {
  if (mdCache[id]) return mdCache[id];
  const r = await fetch(`artifacts/${id}.md`);
  const t = await r.text();
  mdCache[id] = t;
  return t;
}

function renderMd(t) {
  let h = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  h = h.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  h = h.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  h = h.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");
  h = h.replace(/^- (.+)$/gm, "<li>$1</li>");
  h = h.replace(/(<li>.*<\/li>(\s*<li>.*<\/li>)*)/g, "<ul>$1</ul>");
  h = h.replace(/^---$/gm, "<hr>");
  h = h.replace(/\|(.+)\|/g, "<td>$1</td>");
  h = h.replace(/(<td>[^<]+<\/td>(\s*<td>[^<]+<\/td>)*)/g, "<tr>$1</tr>");
  const lines = h.split("\n");
  let out = [], inBlock = false;
  for (const line of lines) {
    const t2 = line.trim();
    if (!t2) { out.push(""); continue; }
    if (t2.startsWith("<h")||t2.startsWith("<pre")||t2.startsWith("<ul")||t2.startsWith("<li")||t2.startsWith("<blockquote")||t2.startsWith("<hr")||t2.startsWith("<tr")||t2.startsWith("<td")) {
      if (!inBlock && t2.startsWith("<li")) { out.push("<ul>"); inBlock = true; }
      out.push(t2); if (t2.startsWith("</ul>")) inBlock = false; continue;
    }
    if (t2.startsWith("</")) { out.push(t2); inBlock = false; continue; }
    out.push(inBlock ? t2 : `<p>${t2}</p>`);
  }
  return out.join("\n");
}

// ─── Build sidebar & routing ───
const sidebarList = document.getElementById("artifact-list");
const container = document.getElementById("content-container");
const emptyState = document.getElementById("empty-state");

sidebarList.innerHTML = artifacts.map(a =>
  `<div class="artifact-item" data-id="${a.id}">
    <div style="display:flex;gap:8px;align-items:baseline">
      <span class="num">${a.id.slice(0,2)}</span>
      <span class="title">${a.title}</span>
    </div>
    <div class="meta">
      <span class="badge ${a.cls}">${a.badge}</span>
      <span>${a.meta}</span>
    </div>
  </div>`
).join("");

let activeId = null;

async function openArtifact(id) {
  activeId = id;
  document.querySelectorAll(".artifact-item").forEach(el => el.classList.remove("active"));
  const el = document.querySelector(`.artifact-item[data-id="${id}"]`);
  if (el) el.classList.add("active");

  emptyState.style.display = "none";
  container.innerHTML = "<div style='padding:40px;color:var(--text-dim)'>Loading...</div>";

  const md = await loadMd(id);
  container.innerHTML = renderMd(md);

  // Close sidebar after selection
  hideSidebar();

  location.hash = id;
}

// Click handler on sidebar items
sidebarList.addEventListener("click", (e) => {
  const item = e.target.closest(".artifact-item");
  if (item) openArtifact(item.dataset.id);
});

// Initialize from hash or first artifact
function init() {
  const hash = location.hash.slice(1);
  if (hash && artifacts.find(a => a.id === hash)) {
    openArtifact(hash);
  } else {
    openArtifact(artifacts[0].id);
  }
}

window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h && artifacts.find(a => a.id === h) && h !== activeId) openArtifact(h);
});

// Start hidden
sidebar.classList.add("hidden");
init();
</script>
</body>
</html>
