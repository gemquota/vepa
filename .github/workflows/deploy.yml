name: Deploy to GitHub Pages

on:
  push:
    branches: [new]

permissions:
  contents: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Build v2 (root)
      - run: npm ci
      - run: npx vite build
      - run: cp -r .dist v2-dist

      # Build v3
      - run: cd v3 && npm ci && npm run build
      - run: cp -r v3/.dist v3-dist

      # Combine into single deploy directory
      - run: mkdir -p deploy
      - run: cp -r v2-dist/* deploy/
      - run: mkdir -p deploy/v3
      - run: cp -r v3-dist/* deploy/v3/

      # Deploy to gh-pages branch
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
